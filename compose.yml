name: vidora

# Secrets are passed per service, never the whole .env: api and worker don't get the MinIO root
# keys, the database owner password or the admin/demo passwords.
x-backend-env: &backend_env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  POSTGRES_DB: ${POSTGRES_DB:-vidora}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?run scripts/gen_env.sh first}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run scripts/gen_env.sh first}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?run scripts/gen_env.sh first}
  BUCKET_RAW: ${BUCKET_RAW:-vidora-raw}
  BUCKET_MEDIA: ${BUCKET_MEDIA:-vidora-media}
  JWT_SECRET: ${JWT_SECRET:?run scripts/gen_env.sh first}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
  SITE_ADDRESS: ${SITE_ADDRESS:-https://}

# api and worker use a DML-only role (see backend/app/scripts/db_roles.py)
x-app-db: &app_db
  POSTGRES_USER: ${APP_DB_USER:-vidora_app}
  POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?run scripts/gen_env.sh first}

# Shared settings for every container built from backend/Dockerfile.
x-backend: &backend
  image: vidora-backend:latest
  build:
    context: ./backend
  environment:
    <<: [*backend_env, *app_db]
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  networks: [internal]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vidora}
      POSTGRES_USER: ${POSTGRES_USER:-vidora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/gen_env.sh first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run scripts/gen_env.sh first}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
    networks: [internal]

  # MinIO community images were removed from Docker Hub in 2025; the frozen Bitnami build
  # runs as non-root. The app talks plain S3 via boto3, so any S3 server can replace it.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run scripts/gen_env.sh first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run scripts/gen_env.sh first}
      MINIO_BROWSER: "off"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt: [no-new-privileges:true]
    networks: [internal]

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    restart: "no"
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run scripts/gen_env.sh first}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run scripts/gen_env.sh first}
      BUCKET_RAW: ${BUCKET_RAW:-vidora-raw}
      BUCKET_MEDIA: ${BUCKET_MEDIA:-vidora-media}
      MC_CONFIG_DIR: /tmp/.mc
    volumes:
      - ./deploy/minio/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    networks: [internal]

  migrate:
    <<: *backend
    restart: "no"
    # Runs as the database owner: schema migrations, then the least-privilege app role.
    command: ["sh", "-c", "alembic upgrade head && python -m app.scripts.db_roles"]
    environment:
      <<: *backend_env
      POSTGRES_USER: ${POSTGRES_USER:-vidora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/gen_env.sh first}
      APP_DB_USER: ${APP_DB_USER:-vidora_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run scripts/gen_env.sh first}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["arq", "app.worker.main.WorkerSettings"]
    environment:
      <<: [*backend_env, *app_db]
      TMPDIR: /work
    volumes:
      - workdata:/work
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.main.WorkerSettings"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: vidora-web:latest
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-https://}
      BUCKET_RAW: ${BUCKET_RAW:-vidora-raw}
      BUCKET_MEDIA: ${BUCKET_MEDIA:-vidora-media}
      TLS_KIND: ${TLS_KIND:-internal}
      ACME_EMAIL: ${ACME_EMAIL:-}
      HSTS_MODE: ${HSTS_MODE:-off}
      HTTP_MODE: redirect
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      api:
        condition: service_healthy
    networks: [internal, edge]

networks:
  # No route to the internet and no published ports: postgres, redis, minio, api, worker.
  internal:
    internal: true
  # Only Caddy sits here (published ports, ACME).
  edge: {}

volumes:
  pgdata:
  redisdata:
  miniodata:
  workdata:
  caddydata:
  caddyconfig:
